name: status-check-functions-demo
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Step that might fail
        id: test
        run: exit 1
      
      - name: Only on success
        if: success()
        run: echo "Previous steps succeeded"
      
      - name: Only on failure
        if: failure()
        run: echo "Previous steps failed"
      
      - name: Always except cancel
        if: ${{ !cancelled() }}
        run: echo "Runs on success or failure"
      
      - name: On cancel
        if: cancelled()
        run: echo "Workflow was canceled"