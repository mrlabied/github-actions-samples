name: expressions-demo
on:
  workflow_dispatch:
    inputs:
      debug:
        type: boolean
        default: false

run-name: "Expressions-debug-${{ inputs.debug && 'on' || 'off' }}"

jobs:
  echo:
    runs-on: ubuntu-latest
    steps:
      - name: Print startup info [debug]
        if: inputs.debug
        run: |
          echo "Triggered by: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Runner OS: ${{ runner.os }}"
      
      - name: Print when triggered from main [debug]
        if: inputs.debug && github.ref == 'refs/heads/main'
        run: |
          echo "I was triggered from main"
          echo "Hello world"

