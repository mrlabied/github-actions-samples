name: External Workflow call

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Appels du workflow réutilisable
  call-tests:
    # Chemin vers le fichier réutilisable dans le dépôt (ou dans un dépôt externe)
    uses: ./.github/workflows/reusable-workflow-example.yml
    # Transmission des variables déclarées dans inputs
    with:
      python-version: '3.11'
    # Transmission des secrets déclarés dans secrets
    secrets:
      API_TOKEN: ${{ secrets.MY_GLOBAL_TOKEN }}