name: CI - Secrets and Environments
on:
  push:
    branches: [main]
jobs:
  staging-environment:
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - name: Inspect values inside job
        run: |
          echo "Repo secret (masked):    ${{ secrets.EXAMPLE_REPOSITORY_SECRET }}"
          echo "Repo variable:           ${{ vars.EXAMPLE_REPOSITORY_VARIABLE }}"
          echo "Env secret (masked):     ${{ secrets.EXAMPLE_ENVIRONMENT_SECRET }}"
          echo "Env variable:            ${{ vars.EXAMPLE_ENVIRONMENT_VARIABLE }}"

  production-environment:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Inspect values inside job
        run: |
          echo "Repo secret (masked):    ${{ secrets.EXAMPLE_REPOSITORY_SECRET }}"
          echo "Repo variable:           ${{ vars.EXAMPLE_REPOSITORY_VARIABLE }}"
          echo "Env secret (masked):     ${{ secrets.EXAMPLE_ENVIRONMENT_SECRET }}"
          echo "Env variable:            ${{ vars.EXAMPLE_ENVIRONMENT_VARIABLE }}"