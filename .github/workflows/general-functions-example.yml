name: general-functions-demo
on:
  pull_request:
    types: [opened]

jobs:
  process-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Print PR title
        run: echo "PR Title -  ${{ github.event.pull_request.title }}"
      
      - name: Print PR labels
        run: |
          cat <<EOF
          ${{ toJson(github.event.pull_request.labels) }}